name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The preview's Korean tests draw with a Hangul font (crates/hanji-preview/tests/render.rs).
      - name: a Korean font for the preview tests
        run: fc-list :lang=ko file | grep -q /usr/share/fonts/ || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk; }
      - run: cargo test --locked --workspace
      - name: byte-only preview without host fonts
        run: cargo test --locked -p hanji-preview --no-default-features --features hwpx
      # The CLI is native only (files, processes, stdio).
      - name: build for wasm32-unknown-unknown
        run: cargo build --locked --target wasm32-unknown-unknown --workspace --exclude hanji-cli
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: test on wasm32-wasip1 (wasmtime)
        run: cargo test --locked --target wasm32-wasip1 --workspace --exclude hanji-cli
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=${{ github.workspace }}

  # Every corpus source and every Office check kit file against the ISO/IEC 29500 transitional
  # schemas, with the rules outside them that Office enforces (validation/ooxml-schema).
  ooxml-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: validation/office-kit
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml==6.0.2
      - uses: actions/cache@v4
        with:
          path: validation/ooxml-schema/xsd
          key: ooxml-xsd-${{ hashFiles('validation/ooxml-schema/SHA256SUMS') }}
      - run: validation/ooxml-schema/fetch.sh
      - name: corpus sources
        run: python3 validation/ooxml-schema/validate.py -q crates/hanji-pptx/corpus crates/hanji-xlsx/corpus prototype/remainder/corpus
      - name: build the Office check kit
        run: cargo run --release --manifest-path validation/office-kit/Cargo.toml
      - name: kit files
        run: python3 validation/ooxml-schema/validate.py -q target/office-kit

  # The Claude Code and Codex plugin (plugins/hanji): manifests, marketplace,
  # the skill, and the hanji CLI run through the skill's launcher.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: offline launcher download and failure checks
        run: python3 scripts/test-launcher.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked -p hanji-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned: a new CLI release that changes the plugin format fails here
      # only when these are bumped.
      - run: npm install -g @anthropic-ai/claude-code@2.1.285 @openai/codex@0.159.2
      - name: Claude Code validates the plugin and the marketplace
        run: |
          claude plugin validate --strict plugins/hanji
          claude plugin validate --strict .
      - name: Claude Code installs it and sees its skill and no MCP server
        run: |
          claude plugin marketplace add "$PWD"
          claude plugin install hanji@hanji
          claude plugin details hanji | tee "$RUNNER_TEMP/details.txt"
          grep -E 'Skills \(1\) +office-documents' "$RUNNER_TEMP/details.txt"
          grep -E 'MCP servers \(0\)' "$RUNNER_TEMP/details.txt"
      - name: Codex installs it and sees its skill
        run: |
          codex plugin marketplace add "$PWD"
          codex plugin add hanji@hanji
          codex debug prompt-input hi | grep -q 'hanji:office-documents'
          if codex mcp get hanji; then exit 1; fi
      - name: the skill's launcher runs the CLI, from the checkout and from each installed copy
        run: |
          launcher=skills/office-documents/scripts/hanji
          claude_copy=$(find ~/.claude/plugins -path "*/$launcher" -type f | head -n 1)
          codex_copy=$(find ~/.codex/plugins -path "*/$launcher" -type f | head -n 1)
          test -n "$claude_copy" && test -n "$codex_copy"
          PATH="$PWD/target/debug:$PATH" python3 scripts/check-plugins.py \
            --installed "${claude_copy%/"$launcher"}" --installed "${codex_copy%/"$launcher"}"
