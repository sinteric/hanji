name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: build for wasm32-unknown-unknown
        run: cargo build --target wasm32-unknown-unknown --workspace
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: test on wasm32-wasip1 (wasmtime)
        run: cargo test --target wasm32-wasip1 --workspace
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir=${{ github.workspace }}
