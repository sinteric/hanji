[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sinteric/hanji"
rust-version = "1.99"

# The lints that hold a rule of hanji's Rust style (STYLE.md). A lint is added
# here only once the tree meets it.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
needless_for_each = "warn"

[workspace.dependencies]
hanji-format = { path = "crates/hanji-format" }
hanji-core = { path = "crates/hanji-core" }
hanji-package = { path = "crates/hanji-package" }
hanji-testkit = { path = "crates/hanji-testkit" }

# One immutable renderer source keeps PPTX and DOCX layout types compatible.
# sinteric/rdocx#25 (571ebef, on main, which has #24): tensorbee/rdocx S96 sprint
# sync, and the Hanji tbRl header/footer clearance reservation is opt-in
# (`Document::set_vertical_story_clearance`).
rdocx = { git = "https://github.com/sinteric/rdocx", rev = "571ebef700e2d09feb4d80ac57c7a564bf5151dd", default-features = false }
rpptx = { git = "https://github.com/sinteric/rdocx", rev = "571ebef700e2d09feb4d80ac57c7a564bf5151dd", default-features = false }
rpptx-render = { git = "https://github.com/sinteric/rdocx", rev = "571ebef700e2d09feb4d80ac57c7a564bf5151dd", default-features = false }
rpptx-layout = { git = "https://github.com/sinteric/rdocx", rev = "571ebef700e2d09feb4d80ac57c7a564bf5151dd", default-features = false }
oxml-layout = { git = "https://github.com/sinteric/rdocx", rev = "571ebef700e2d09feb4d80ac57c7a564bf5151dd", default-features = false }
# sinteric/rhwp main (0.9.1 plus Hanji fork contracts and zip 9.0.4, sinteric/rhwp#7).
rhwp = { git = "https://github.com/sinteric/rhwp", rev = "f705d7fbadac017be9810dce4ad2597f2131f70b", default-features = false }

# The spreadsheet engine's tests read 100,000-row sheets (§2 rule 11) in
# debug builds too: its parsers and calculator are optimised there.
[profile.dev.package.hanji-xlsx]
opt-level = 2

[profile.dev.package.hanji-package]
opt-level = 2

[profile.dev.package.quick-xml]
opt-level = 2

[profile.dev.package.memchr]
opt-level = 2

[profile.dev.package.ironcalc_base]
opt-level = 2

# S92 table-style XML is a large value; unoptimised debug copies overflow
# the default wasm stack while PPTX preview still parses those styles.
[profile.dev.package.oxml-drawing]
opt-level = 2
