[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sinteric/hanji"
rust-version = "1.99"

# The lints that hold a rule of hanji's Rust style (STYLE.md). A lint is added
# here only once the tree meets it.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
needless_for_each = "warn"

[workspace.dependencies]
hanji-format = { path = "crates/hanji-format" }
hanji-core = { path = "crates/hanji-core" }
hanji-package = { path = "crates/hanji-package" }
hanji-testkit = { path = "crates/hanji-testkit" }

# One immutable renderer source keeps PPTX and DOCX layout types compatible.
# S95.4 (sinteric/rdocx main 73894d2): Word legacy/modern form-field authoring, mail merge, relationship/style preservation, body read/edit bounds, PowerPoint publisher bounds, CJK line measurement, rendering changes, plus an upstream merge on top of S95.2/S95.3.
rdocx = { git = "https://github.com/sinteric/rdocx", rev = "73894d216764a21801aff08c83ffc58f4fa3b11e", default-features = false }
rpptx = { git = "https://github.com/sinteric/rdocx", rev = "73894d216764a21801aff08c83ffc58f4fa3b11e", default-features = false }
rpptx-render = { git = "https://github.com/sinteric/rdocx", rev = "73894d216764a21801aff08c83ffc58f4fa3b11e", default-features = false }
rpptx-layout = { git = "https://github.com/sinteric/rdocx", rev = "73894d216764a21801aff08c83ffc58f4fa3b11e", default-features = false }
oxml-layout = { git = "https://github.com/sinteric/rdocx", rev = "73894d216764a21801aff08c83ffc58f4fa3b11e", default-features = false }
# sinteric/rhwp main (0.8.7 plus Hanji fork contracts and zip 9.0.4).
rhwp = { git = "https://github.com/sinteric/rhwp", rev = "d2fdbebf32e5182bb7f2e365ed9642bf7f5a9924", default-features = false }

# The spreadsheet engine's tests read 100,000-row sheets (§2 rule 11) in
# debug builds too: its parsers and calculator are optimised there.
[profile.dev.package.hanji-xlsx]
opt-level = 2

[profile.dev.package.hanji-package]
opt-level = 2

[profile.dev.package.quick-xml]
opt-level = 2

[profile.dev.package.memchr]
opt-level = 2

[profile.dev.package.ironcalc_base]
opt-level = 2

# S92 table-style XML is a large value; unoptimised debug copies overflow
# the default wasm stack while PPTX preview still parses those styles.
[profile.dev.package.oxml-drawing]
opt-level = 2

# Preserve the rhwp workspace's deterministic dependency patch in this consumer.
[patch.crates-io]
svg2pdf = { git = "https://github.com/edwardkim/svg2pdf", rev = "2caeb0a038f9128b79833d803b94c2667565c4da" }
