[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sinteric/hanji"
rust-version = "1.99"

[workspace.dependencies]
hanji-format = { path = "crates/hanji-format" }
hanji-core = { path = "crates/hanji-core" }
hanji-package = { path = "crates/hanji-package" }
hanji-testkit = { path = "crates/hanji-testkit" }

# One immutable renderer source keeps PPTX and DOCX layout types compatible.
# S92 includes the upstream sync and the fork CI doctest wrapper.
rdocx = { git = "https://github.com/sinteric/rdocx", rev = "6725e96f9ff2c445536593ba7f6c3a20fdde7698", default-features = false }
rpptx = { git = "https://github.com/sinteric/rdocx", rev = "6725e96f9ff2c445536593ba7f6c3a20fdde7698", default-features = false }
rpptx-render = { git = "https://github.com/sinteric/rdocx", rev = "6725e96f9ff2c445536593ba7f6c3a20fdde7698", default-features = false }
rpptx-layout = { git = "https://github.com/sinteric/rdocx", rev = "6725e96f9ff2c445536593ba7f6c3a20fdde7698", default-features = false }
oxml-layout = { git = "https://github.com/sinteric/rdocx", rev = "6725e96f9ff2c445536593ba7f6c3a20fdde7698", default-features = false }
# sinteric/rhwp main (0.8.7 plus Hanji fork contracts).
rhwp = { git = "https://github.com/sinteric/rhwp", rev = "260c6df57f7655875be83f6d23acc83499a0a2a4", default-features = false }

# The spreadsheet engine's tests read 100,000-row sheets (§2 rule 11) in
# debug builds too: its parsers and calculator are optimised there.
[profile.dev.package.hanji-xlsx]
opt-level = 2

[profile.dev.package.hanji-package]
opt-level = 2

[profile.dev.package.quick-xml]
opt-level = 2

[profile.dev.package.memchr]
opt-level = 2

[profile.dev.package.ironcalc_base]
opt-level = 2

# S92 table-style XML is a large value; unoptimised debug copies overflow
# the default wasm stack while PPTX preview still parses those styles.
[profile.dev.package.oxml-drawing]
opt-level = 2

# Preserve the rhwp workspace's deterministic dependency patch in this consumer.
[patch.crates-io]
svg2pdf = { git = "https://github.com/edwardkim/svg2pdf", rev = "2caeb0a038f9128b79833d803b94c2667565c4da" }
