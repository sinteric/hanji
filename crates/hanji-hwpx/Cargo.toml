[package]
name = "hanji-hwpx"
description = "hanji hwpx engine: split the OWPML section parts into model text and remainder, and recombine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hanji-format.workspace = true
hanji-core.workspace = true
hanji-package.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhwp = { workspace = true, optional = true }

[features]
# Binary HWP through rhwp (`hwp` module): read .hwp as HWPX, write HWPX back as .hwp.
hwp = ["dep:rhwp"]

[dev-dependencies]
hanji-testkit.workspace = true

[lints]
workspace = true
