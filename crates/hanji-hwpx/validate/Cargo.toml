[package]
name = "hwpx-validate"
version = "0.0.0"
edition = "2021"
publish = false
description = "Re-opens every hwpx export of the corpus test with rhwp (§9 validity). Not part of the workspace: rhwp comes from git and is large."

# Standalone: an empty [workspace] keeps this crate out of the hanji workspace build.
[workspace]

[dependencies]
rhwp = { git = "https://github.com/sinteric/rhwp", rev = "f705d7fbadac017be9810dce4ad2597f2131f70b", default-features = false }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
