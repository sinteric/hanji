[package]
name = "hanji-mcp"
description = "hanji as an MCP server over stdio: office documents for LLM agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# rmcp needs 1.88, hanji-preview (rpptx) 1.93.
rust-version = "1.93"

[[bin]]
name = "hanji-mcp"
path = "src/main.rs"

[dependencies]
hanji-store = { path = "../hanji-store" }
hanji-preview = { path = "../hanji-preview" }
base64 = "0.22"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "io-std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hanji-package.workspace = true
