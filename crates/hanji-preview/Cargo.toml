[package]
name = "hanji-preview"
description = "hanji preview: package bytes to document/presentation pages and bounded worksheet grids, with embedded fonts and diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# rpptx 0.12 needs 1.93.
rust-version = "1.93"

[features]
# Keep the existing native API; byte-only consumers can disable this adapter.
default = ["host-fonts", "hwpx"]
host-fonts = ["dep:hanji-store", "oxml-layout/system-fonts", "fontdb/fs", "fontdb/fontconfig"]
# The CLI includes HWPX; small PPTX/DOCX byte-only consumers can omit rhwp.
hwpx = ["dep:rhwp"]

[dependencies]
hanji-core.workspace = true
hanji-package.workspace = true
hanji-pptx = { path = "../hanji-pptx" }
hanji-xlsx = { path = "../hanji-xlsx" }
rpptx = { workspace = true, features = ["render"] }
rpptx-render.workspace = true
rpptx-layout.workspace = true
rdocx.workspace = true
rhwp = { workspace = true, optional = true }
ttf-parser = "0.25"
oxml-layout.workspace = true
fontdb = { version = "0.23", default-features = false, features = ["std"] }
allsorts = { version = "0.17", default-features = false, features = ["flate2_zlib-rs"] }
resvg = { version = "=0.48.1", default-features = false, features = ["text", "raster-images"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
hanji-store = { path = "../hanji-store", optional = true }

[dev-dependencies]
serde_json = "1"
