# The preview's font alias table (DESIGN.md §7.1). Compiled into hanji; an
# `aliases.toml` in a font directory (--font-dir, HANJI_FONT_DIR) is read
# after it, and an entry there that shares a name with one here replaces it.
#
# A requested face is drawn by the first that exists:
#   1. the face itself, by any of its `names` (font directory, then system fonts);
#   2. a `metric` face (the same advances: Carlito = Calibri);
#   3. a `substitute` (other glyphs and widths);
#   4. the `class` fallback (sans, serif or mono).
# Each of 2–4 is looked up in the font directory, system fonts, then the faces
# compiled into hanji (Carlito, Caladea, Liberation Sans/Serif/Mono).
#
# `ea_advance` (optional): the requested face's Hangul and CJK advance in em,
# measured (§7.1). A substitute is laid out with it, so lines break where the
# requested face breaks them ("metrics: table" in the report).

# Korean, Microsoft
[[family]]
names = ["맑은 고딕", "Malgun Gothic", "MalgunGothic"]
substitute = ["Noto Sans CJK KR", "Noto Sans KR", "Source Han Sans K", "Source Han Sans KR", "Apple SD Gothic Neo", "NanumGothic"]
class = "sans"
ea_advance = 1.0

[[family]]
names = ["굴림", "Gulim", "굴림체", "GulimChe"]
substitute = ["Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", "Source Han Sans K", "Apple SD Gothic Neo", "NanumGothic"]
class = "sans"
ea_advance = 1.0

[[family]]
names = ["돋움", "Dotum", "돋움체", "DotumChe"]
substitute = ["Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", "Source Han Sans K", "Apple SD Gothic Neo", "NanumGothic"]
class = "sans"
ea_advance = 1.0

[[family]]
names = ["바탕", "Batang", "바탕체", "BatangChe"]
substitute = ["Noto Serif CJK KR", "Noto Serif KR", "Source Han Serif K", "Source Han Serif KR", "AppleMyungjo", "NanumMyeongjo"]
class = "serif"
ea_advance = 1.0

[[family]]
names = ["궁서", "Gungsuh", "궁서체", "GungsuhChe"]
substitute = ["Noto Serif CJK KR", "Noto Serif KR", "Source Han Serif K", "AppleMyungjo", "NanumMyeongjo"]
class = "serif"

