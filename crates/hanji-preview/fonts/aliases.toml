[[family]]
names = ["함초롬돋움", "HCR Dotum", "HCRDotum"]
substitute = ["Noto Sans CJK KR", "Noto Sans KR", "Source Han Sans K", "Source Han Sans KR", "Apple SD Gothic Neo", "NanumGothic"]
