# Latin, with metric-compatible faces
[[family]]
names = ["Calibri"]
metric = ["Carlito"]
class = "sans"

[[family]]
names = ["Calibri Light"]
metric = ["Carlito"]
class = "sans"

[[family]]
names = ["Cambria"]
metric = ["Caladea"]
class = "serif"

[[family]]
names = ["Arial", "Helvetica"]
metric = ["Liberation Sans", "Arimo"]
class = "sans"

[[family]]
names = ["Times New Roman", "Times"]
metric = ["Liberation Serif", "Tinos"]
class = "serif"

[[family]]
names = ["Courier New", "Courier"]
metric = ["Liberation Mono", "Cousine"]
class = "mono"

# Latin, substitutes only
[[family]]
names = ["Aptos", "Aptos Display", "Segoe UI", "Tahoma", "Verdana", "Century Gothic", "Trebuchet MS"]
substitute = ["Carlito", "Liberation Sans"]
class = "sans"

[[family]]
names = ["Georgia", "Garamond", "Palatino Linotype", "Book Antiqua"]
substitute = ["Caladea", "Liberation Serif"]
class = "serif"

[[family]]
names = ["Consolas", "Lucida Console"]
substitute = ["Liberation Mono"]
class = "mono"

# Korean faces with Latin glyphs of their own, standing in for each other
[[family]]
names = ["Noto Sans KR", "Noto Sans CJK KR", "Source Han Sans K", "Source Han Sans KR", "본고딕"]
substitute = ["Noto Sans CJK KR", "Noto Sans KR", "Source Han Sans K", "Source Han Sans KR"]
class = "sans"

[[family]]
names = ["Noto Serif KR", "Noto Serif CJK KR", "Source Han Serif K", "Source Han Serif KR", "본명조"]
substitute = ["Noto Serif CJK KR", "Noto Serif KR", "Source Han Serif K", "Source Han Serif KR"]
class = "serif"

# The class fallbacks: the last candidates for a face the table does not
# name (its class is unknown, so sans) or whose candidates are all missing.
# PowerPoint draws Latin text in a face it does not have in Calibri, hence
# Carlito first (on the preview baseline, deck 13's Pretendard: layout 0.887
# with Liberation Sans, 0.975 with Carlito).
[class.sans]
latin = ["Carlito", "Liberation Sans"]
hangul = ["Noto Sans CJK KR", "Noto Sans KR", "Source Han Sans K", "Malgun Gothic", "Apple SD Gothic Neo", "NanumGothic"]

[class.serif]
latin = ["Liberation Serif"]
hangul = ["Noto Serif CJK KR", "Noto Serif KR", "Source Han Serif K", "Batang", "AppleMyungjo", "NanumMyeongjo", "Noto Sans CJK KR", "Noto Sans KR"]

[class.mono]
latin = ["Liberation Mono"]
hangul = ["Noto Sans Mono CJK KR", "Noto Sans CJK KR", "Noto Sans KR", "D2Coding", "NanumGothicCoding"]
