[package]
name = "hanji-store"
description = "hanji documents and revisions, and the operations of the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hanji-format.workspace = true
hanji-core.workspace = true
hanji-package.workspace = true
hanji-docx = { path = "../hanji-docx" }
hanji-hwpx = { path = "../hanji-hwpx" }
hanji-pptx = { path = "../hanji-pptx" }
hanji-xlsx = { path = "../hanji-xlsx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["hwp"]
# Binary .hwp through rhwp (DESIGN.md §5.6): opened as HWPX, written back as
# .hwp when rhwp's check finds nothing lost.
hwp = ["hanji-hwpx/hwp"]

[lints]
workspace = true
