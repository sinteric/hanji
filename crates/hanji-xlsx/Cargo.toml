[package]
name = "hanji-xlsx"
description = "hanji xlsx engine: workbook structure as text, cells through row windows and range operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hanji-format.workspace = true
hanji-core.workspace = true
hanji-package.workspace = true
quick-xml = "0.42"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A calculator only (§5.4): cached values are computed over the model; IronCalc never reads or writes the file.
# 0.7.1: later versions take the time zone from JavaScript on every wasm32 target, which wasm32-wasip1 lacks.
ironcalc_base = "=0.7.1"

[dev-dependencies]
hanji-testkit.workspace = true
